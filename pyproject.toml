[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "surveyflow"
version = "0.4.5"
description = "Survey data pipeline: rawdata.csv + metadata.json + datatable.xlsx with sig testing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "scipy>=1.10",
    "numpy>=1.24",
]

[project.scripts]
surveyflow-run = "surveyflow.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[tool.hatch.build.targets.wheel]
packages = ["surveyflow"]
