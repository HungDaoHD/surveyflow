[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "surveyflow"
version = "0.5.7"
description = "Survey data pipeline: rawdata.csv + metadata.json + datatable.xlsx with sig testing"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "scipy>=1.10",
    "numpy>=1.24",
]

[project.scripts]
surveyflow-run  = "surveyflow.cli:main"
surveyflow-pptx = "surveyflow.steps.appendix.generate_pptx:main"

[project.optional-dependencies]
dev  = ["pytest>=7.0", "pytest-cov"]
pptx = ["python-pptx>=0.6", "matplotlib>=3.7"]

[tool.hatch.build.targets.wheel]
packages = ["surveyflow"]

