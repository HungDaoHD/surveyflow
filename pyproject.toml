[build-system]
# Pinned below 1.30 — 1.30+ emits Metadata-Version 2.5, which the packaging
# library used by twine (as installed at release time) does not yet recognize,
# causing `twine upload` to fail with "InvalidDistribution: '2.5' is not a
# valid metadata version". Bump this once twine/packaging support 2.5.
requires = ["hatchling>=1.25,<1.30"]
build-backend = "hatchling.build"

[project]
name = "surveyflow"
version = "0.7.6"
description = "Survey data pipeline: rawdata.csv + metadata.json + datatable.xlsx with sig testing"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "scipy>=1.10",
    "numpy>=1.24",
]

[project.scripts]
surveyflow-run  = "surveyflow.cli:main"
surveyflow-pptx = "surveyflow.steps.appendix.generate_pptx:main"

[project.optional-dependencies]
dev  = ["pytest>=7.0", "pytest-cov"]
pptx = ["python-pptx>=0.6", "matplotlib>=3.7"]

[tool.hatch.build.targets.wheel]
packages = ["surveyflow"]

